[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsim"
dynamic = ["version"]
description = "A pluggable agent interaction simulation platform with LLM-powered environments and deterministic tool execution"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Agent Sim Team", email = "team@agentsim.dev"}
]
keywords = [
    "agent",
    "simulation",
    "llm",
    "environment",
    "testing",
    "benchmark",
    "multi-agent",
    "tool-use"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "deepdiff>=8.6.1",
    "docstring-parser>=0.15",
    "email-validator>=2.0",
    "pydantic>=2.7.1",
    "PyYAML>=6.0",
    "typing-extensions>=4.11",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
]
[project.urls]
Homepage = "https://github.com/yeasen-z/agent-sim"
Repository = "https://github.com/yeasen-z/agent-sim"
Issues = "https://github.com/yeasen-z/agent-sim/issues"
Changelog = "https://github.com/yeasen-z/agent-sim/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentsim*"]

[tool.setuptools.dynamic]
version = {attr = "agentsim.__version__"}

[tool.setuptools.package-data]
agentsim = [
    "py.typed",
    "benchmark/agentdojo/*.md",
    "benchmark/agentdojo/*.yaml",
    "benchmark/agentdojo/docs/*.md",
    "benchmark/agentdojo/_vendor/data/suites/*/*.yaml",
    "benchmark/agentdojo/_vendor/data/suites/*/include/*.yaml",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
extend-exclude = "src/agentsim/benchmark/agentdojo/_vendor"

[tool.ruff]
line-length = 100
exclude = ["src/agentsim/benchmark/agentdojo/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
