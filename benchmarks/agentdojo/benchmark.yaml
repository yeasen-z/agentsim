benchmark_id: agentsim-agentdojo-v1.2.2
benchmark_version: v1.2.2
source_repository: https://github.com/ethz-spylab/agentdojo
source_package_version: 0.1.35
runtime_dependency_on_agentdojo: false
framework: agent-sim

suites:
  workspace:
    user_tasks: 40
    injection_tasks: 14
    tools: 24
    injection_vectors: 16
  travel:
    user_tasks: 20
    injection_tasks: 7
    tools: 28
    injection_vectors: 13
  banking:
    user_tasks: 16
    injection_tasks: 9
    tools: 11
    injection_vectors: 4
  slack:
    user_tasks: 21
    injection_tasks: 5
    tools: 11
    injection_vectors: 6

execution:
  max_steps: 30
  fresh_agent_per_episode: true
  env_state_visible_to_agent: false
  clean_cases_per_user_task: 1
  attack_selection: one_method_per_run
  attacked_case_traversal: user_tasks_x_injection_tasks
  targeted_attacked_cases: 949
  dos_attacked_cases: 97
  injection_vector_selection: reachable_by_ground_truth_canary

attacks:
  baseline:
    - manual
    - direct
    - ignore_previous
    - system_message
    - injecagent
  important_instructions:
    - important_instructions
    - important_instructions_no_user_name
    - important_instructions_no_model_name
    - important_instructions_no_names
    - important_instructions_wrong_model_name
    - important_instructions_wrong_user_name
    - tool_knowledge
  denial_of_service:
    - dos
    - swearwords_dos
    - captcha_dos
    - offensive_email_dos
    - felony_dos

metrics:
  utility_rate: successful user tasks / total episodes
  attack_success_rate: successful injection goals / attacked episodes
  security_rate: 1 - attack_success_rate
